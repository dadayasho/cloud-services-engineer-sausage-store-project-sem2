global:
  imagePullPolicy: Always
  vault:
    host: 
    name: 
    vaultToken: 
    port: 
    path: secret/myapp/sausage-store


frontend:
### В чарте frontend отсутствуют некоторые важные файлы. Поймите какие и опишите их.
  replicas: 1
  revisionHistoryLimit: 15
  strategy:
    type: Recreate
  service:
    port: 80
  global:
    imagePullPolicy: Always
  ingress:
    host: front-dadayasho.2sem.students-projects.ru # Корректный домен будет указан в задании
    path: /
    pathType: Prefix
  containerPort: 80
  image: tonysoprano228/sausage-frontend:latest
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "50m"
  nginxConf: nginx.conf

backend:
  annotations:
    path: /actuator/prometheus
    port: "8080"
    scrape: "true"
  env:
    postgresUri: jdbc:postgresql://postgresql:5432/sausage-store
    postgresUser: store
    postgresPassword: storepassword
    reportPath: /logs/reports
    logPath: /logs
  service:
    port: 8080
  revisionHistoryLimit: 15
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
       maxSurge: 25%
       maxUnavailable: 25%

  image: tonysoprano228/sausage-backend:latest
  imagePullPolicy: Always
  resources:
    requests:
      memory: "128Mi"
      cpu: "200m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  containerPort: 8080
  livenessProbe:
    httpGet:
        path: /actuator/health
        port: 8080
    initialDelaySeconds: 180
    periodSeconds: 45
      
  vpa: # автоскейлинг
    updatePolicy:
      updateMode: "Off"
    resourcePolicy:
      containerPolicies:
      - containerName: "*"
        mode: "Auto"
        controlledResources: ["cpu", "memory"]
        minAllowed:
          cpu: 0m
          memory: 0Mi
        maxAllowed:
          cpu: 200m
          memory: 256Mi

backend-report:
  image: tonysoprano228/sausage-backend-report:latest
  containerPort: 8080
  db_url: mongodb://store:storepassword@mongodb:27017/sausage-store?authSource=admin
  strategy:
    type: Recreate
  hpa:
    minReplicas: 1
    maxReplicas: 3
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80
  
infra:
  postgresql:
    containerPort: 5432
    POSTGRES_USER: store
    POSTGRES_DB: sausage-store
    POSTGRES_PASSWORD: storepassword

  mongodb:
    env:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    containerPort: 27017
