global:
  imagePullPolicy: Always
  ###vault:
  ###  host: ip
  ###  name: vault
  ###  vaultToken: someToken


frontend:
### В чарте frontend отсутствуют некоторые важные файлы. Поймите какие и опишите их.
  replicas: 1
  revisionHistoryLimit: 15
  strategy:
    type: Recreate
  service:
    port: 80
  global:
    imagePullPolicy: Always
  ingress:
    host: front-dadayasho.2sem.students-projects.ru # Корректный домен будет указан в задании
    path: /
    pathType: Prefix
  containerPort: 80
  image: tonysoprano228/sausage-frontend:latest
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "1"
  nginxConf: nginx.conf

backend:
  annotations:
    path: /actuator/prometheus
    port: "8080"
    scrape: "true"
  env:
    postgresUri: jdbc:postgresql://postgresql:5432/sausage-store
    postgresUser: store
    postgresPassword: storepassword
    reportPath: /logs/reports
    logPath: /logs
  service:
    port: 8080
  revisionHistoryLimit: 15
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
       maxSurge: 25%
       maxUnavailable: 25%

  image: tonysoprano228/sausage-backend:latest
  imagePullPolicy: Always
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1"
  containerPort: 8080
  livenessProbe:
    httpGet:
        path: /actuator/health
        port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
      
  vpa: # автоскейлинг
    updatePolicy:
      updateMode: "Off"
    resourcePolicy:
      containerPolicies:
      - containerName: "*"
        mode: "Auto"
        controlledResources: ["cpu", "memory"]
        minAllowed:
          cpu: 0m
          memory: 0Mi
        maxAllowed:
          cpu: 250m
          memory: 500Mi

backend-report:
  image: tonysoprano228/sausage-backend-report:latest
  containerPort: 8080
  db_url: mongodb://store:storepassword@mongodb:27017/sausage-store?authSource=admin
  strategy:
    type: Recreate
  hpa:
    minReplicas: 1
    maxReplicas: 3
    pods:
      metric:
        name: vllm_request_latency_seconds
      target:
        type: AverageValue
        averageValue: 200m
  
infra:
  postgresql:
    containerPort: 5432
    POSTGRES_USER: store
    POSTGRES_DB: sausage-store
    POSTGRES_PASSWORD: storepassword

  mongodb:
    env:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    containerPort: 27017
