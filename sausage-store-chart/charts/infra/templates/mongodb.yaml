apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-conf
data:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.mongodb.env.MONGO_INITDB_ROOT_USERNAME }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.mongodb.env.MONGO_INITDB_ROOT_PASSWORD }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-create-user
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mongodb
          image: mongo:7
          command: ["sh", "-c"]
          args:
            - >
              until mongosh "mongodb://{{ .Values.mongodb.env.MONGO_INITDB_ROOT_USERNAME }}:{{ .Values.mongodb.env.MONGO_INITDB_ROOT_PASSWORD }}@mongodb:27017/admin?authSource=admin"
              --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; do
                echo "waiting for mongodb...";
                sleep 2;
              done;
              mongosh "mongodb://{{ .Values.mongodb.env.MONGO_INITDB_ROOT_USERNAME }}:{{ .Values.mongodb.env.MONGO_INITDB_ROOT_PASSWORD }}@mongodb:27017/admin?authSource=admin"
              --eval 'db.getSiblingDB("admin").createUser({
                user: "store",
                pwd: "storepassword",
                roles: [
                  { role: "readWrite", db: "sausage-store" }
                ]
              })'

