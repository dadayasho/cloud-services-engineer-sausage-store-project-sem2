apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  labels:
    app: {{ .Release.Name }}-{{ .Chart.Name }}
    namespace: {{ .Release.Namespace }}
spec:
    ports:
    - name: {{ .Release.Name }}-{{ .Chart.Name }}
      port: {{ .Values.containerPort }}
      targetPort: {{ .Values.containerPort }}
    clusterIP: None
    selector:
      app: {{ .Release.Name }}-{{ .Chart.Name }}