apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
   matchLabels:
    app: {{ .Release.Name }}-{{ .Chart.Name }}
  replicas: 1
  strategy:
    {{ toYaml .Values.strategy | indent 1 }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Chart.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}-{{ .Chart.Name }}
          image: {{ .Values.image }}
          imagePullPolicy: "IfNotPresent"
          envFrom:
          - configMapRef:
              name: backend-report-conf
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-report-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-{{ .Chart.Name }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric:
          {{ toYaml .Values.hpa.pods.metric | nindent 10 }}
        target:
          {{ toYaml .Values.hpa.pods.target | nindent 10 }}